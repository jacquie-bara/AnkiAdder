name: Desktop builds
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            command: npm run dist:win -- --x64 --publish never
          - os: macos-latest
            platform: macos-arm64
            command: npm run dist:mac -- --arm64 --publish never
          - os: macos-latest
            platform: macos-x64
            command: npm run dist:mac -- --x64 --publish never
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: AnkiAdder-${{ matrix.platform }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
